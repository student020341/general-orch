services:
  postgres:
    image: postgres:16
    container_name: orch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${POSTGRES_DB:-temporal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal} -d ${POSTGRES_DB:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orch-net

  nats:
    image: nats:latest
    container_name: orch-nats
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    networks:
      - orch-net

  nats-ui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: orch-nats-ui
    depends_on:
      - nats
    ports:
      - "31311:31311"
    volumes:
      - nuidata:/db
    networks:
      - orch-net

  temporal:
    image: temporalio/auto-setup:latest
    container_name: orch-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-temporal}
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
    ports:
      - "7233:7233"
    networks:
      - orch-net

  temporal-ui:
    image: temporalio/ui:latest
    container_name: orch-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - orch-net

volumes:
  pgdata:
  natsdata:
  nuidata:

networks:
  orch-net:
    driver: bridge
